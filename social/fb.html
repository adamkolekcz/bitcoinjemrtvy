<!DOCTYPE html>
<!--
  FB LANDSCAPE — 1200×630 px
  ────────────────────────────────────────────────────────────────────────────
  JAK POUŽÍT:
  1. Otevři v prohlížeči (Chrome doporučen)
  2. Zoom nastav na 100 % (Cmd+0)
  3. Nahraď kočičku: v sekci "CAT" vyměň <div class="cat placeholder">
     za <img src="kocka.png" class="cat"> a odstraň vnitřní <span> elementy
  4. Screenshot celého okna (nebo DevTools → Screenshot node)
  ────────────────────────────────────────────────────────────────────────────
-->
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Prodej teď – FB 1200×630</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; }

    .frame {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    /* ── CHART ── */
    .chart {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── HEADLINE vlevo ── */
    .headline {
      position: absolute;
      top: 50%;
      left: 72px;
      transform: translateY(-54%);
      z-index: 10;
      line-height: 1;
    }
    .headline .w { display: block; font-size: 118px; font-weight: 900; color: #ffffff; letter-spacing: -6px; text-transform: uppercase; }
    .headline .r { display: block; font-size: 118px; font-weight: 900; color: #ef4444; letter-spacing: -6px; text-transform: uppercase; text-shadow: 0 0 70px rgba(239,68,68,0.55); }

    /* ── CAT vpravo ── */
    .cat {
      position: absolute;
      bottom: 0px;
      right: 48px;
      width: 440px;
      height: 440px;
      z-index: 20;
      object-fit: contain;
    }

    /* ── BRANDING ── */
    .brand {
      position: absolute;
      bottom: 32px;
      left: 72px;
      color: rgba(255,255,255,0.22);
      font-size: 15px;
      letter-spacing: 0.4px;
      z-index: 20;
    }
  </style>
</head>
<body>
<div class="frame">

  <!-- CHART -->
  <svg class="chart" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <defs>
      <linearGradient id="fill-fb" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ef4444" stop-opacity="0.28"/>
        <stop offset="65%"  stop-color="#ef4444" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow-fb" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Jemná mřížka -->
    <g stroke="#171717" stroke-width="1">
      <line x1="0"    y1="160" x2="1200" y2="160"/>
      <line x1="0"    y1="310" x2="1200" y2="310"/>
      <line x1="0"    y1="460" x2="1200" y2="460"/>
      <line x1="240"  y1="0"   x2="240"  y2="630"/>
      <line x1="480"  y1="0"   x2="480"  y2="630"/>
      <line x1="720"  y1="0"   x2="720"  y2="630"/>
      <line x1="960"  y1="0"   x2="960"  y2="630"/>
    </g>

    <!-- Výplň pod čarou -->
    <path
      d="M 0,195 L 60,175 L 105,186 L 155,165 L 200,174 L 242,150 L 278,157 L 308,143 L 332,138 L 356,135
         L 378,300 L 408,335 L 428,318 L 452,348 L 486,368 L 518,356 L 550,378 L 592,394 L 638,384
         L 684,410 L 736,424 L 788,416 L 840,438 L 892,450 L 940,446 L 990,462 L 1060,472 L 1130,480 L 1200,488
         L 1200,630 L 0,630 Z"
      fill="url(#fill-fb)"
    />

    <!-- Čára grafu -->
    <path
      d="M 0,195 L 60,175 L 105,186 L 155,165 L 200,174 L 242,150 L 278,157 L 308,143 L 332,138 L 356,135
         L 378,300 L 408,335 L 428,318 L 452,348 L 486,368 L 518,356 L 550,378 L 592,394 L 638,384
         L 684,410 L 736,424 L 788,416 L 840,438 L 892,450 L 940,446 L 990,462 L 1060,472 L 1130,480 L 1200,488"
      fill="none"
      stroke="#ef4444"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow-fb)"
    />
  </svg>

  <!-- HEADLINE -->
  <div class="headline">
    <span class="w">PRODEJ</span>
    <span class="r">TEĎ</span>
  </div>

  <!-- CAT -->
  <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fassets.stickpng.com%2Fimages%2F5ee772d099588c0004aa684b.png&f=1&nofb=1&ipt=dd1a852bb8f2aaa7d451161a5b0999ede70654eb06f70d3728ff782fec73b984" class="cat" alt="plačící kočička">

  <!-- BRANDING -->
  <div class="brand">bitcoinjemrtvy.cz</div>

</div>
</body>
</html>
