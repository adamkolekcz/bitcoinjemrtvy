name: Auto-translate obituaries

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      override:
        description: "Bypass the threshold guard (large legitimate batch)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync data from bitcoindeaths.com
        run: |
          node scripts/sync-deaths.mjs
          node scripts/fetch-source-urls.mjs

      - name: Translate new articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_OVERRIDE: ${{ inputs.override }}
        run: node scripts/translate-deaths.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/; then
            echo "No data changes, nothing to commit."
            exit 0
          fi
          git add src/data/deaths.json src/data/source-urls.json src/data/translations-cs.json
          git commit -m "data: auto-překlad nových obituárií"
          git pull --rebase origin main
          git push

      - name: IndexNow ping
        if: hashFiles('.indexnow-urls.txt') != ''
        run: node scripts/ping-indexnow.mjs
